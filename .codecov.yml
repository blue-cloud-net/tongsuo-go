# Codecov 配置：与 scripts/check-coverage.sh 配合使用
# 注意：本仓库的覆盖率门禁目前由 scripts/check-coverage.sh 直接检查（≥ 60%）
# Codecov 仅作为可视化与历史趋势追踪的补充。

codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 2   # 等待 ubuntu + macOS 都跑完
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...80"

  status:
    project:
      default:
        target: 60%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 60%

# 忽略非交付代码
ignore:
  - "examples/**"
  - "docs/**"
  - "scripts/**"
  - "internal/testutil/**"
  - "**/*_tongsuocli_test.go"
  - "**/example_test.go"

# 注释风格
comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true