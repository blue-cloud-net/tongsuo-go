# GitHub Actions Release workflow for tongsuo-go
#
# 触发：推送 v* 标签时（如 v0.1.0、v0.2.0-rc1）
# 流程：
#   1. 复用 CI 工作流跑测试（workflow_call，与 CI 完全同源，杜绝 CI 与 Release 分歧）
#   2. 从 CHANGELOG.md (英文) + CHANGELOG.zh.md (中文) 抽取当前 tag 对应版本说明
#      - 任一文件缺失对应版本条目 → 立即失败（不发布）
#      - 格式：英文在前，中文在后，中间空 3 行
#   3. 创建 GitHub Release，仅附"版本说明"body，不上传任何二进制产物
#
# 注意：本仓库发布物仅为 CHANGELOG 文本，不附 examples 二进制。
# 若未来需要再发二进制产物，在 release job 增加上传步骤即可，测试仍走 CI。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write   # 创建 release 需要写权限

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # release 不取消已运行的

jobs:
  # ---------------------------------------------------------------------------
  # 1. 测试：复用 CI 工作流（ubuntu + macOS × amd64/arm64）
  #    - 与 CI 完全同源：从同一 workflow 文件读矩阵 / Tongsuo 配置 / 缓存键
  #    - 任何 CI 与 Release 的"测试分歧"在结构上不可能发生
  # ---------------------------------------------------------------------------
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # 2. 抽取 CHANGELOG 当前 tag 版本说明（中英两份），任一缺失即失败
  #    实现：scripts/extract_release_notes.py
  #      - 从 CHANGELOG.md (英文) / CHANGELOG.zh.md (中文) 抽取对应版本段落
  #      - 拼接格式：英文在前，3 空行，中文在后
  #      - 任一缺失：exit 1（带 ::error:: 日志），release job 因此被阻断
  #    输出：release-notes.md（位于 step 工作目录）
  # ---------------------------------------------------------------------------
  extract-notes:
    name: Extract release notes
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Determine version (without leading "v")
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-}"
          # workflow_dispatch 时取输入的 tag；push tag 时 REF 即为 tag
          if [ -z "$REF" ] || [ "$REF" = "refs/heads/main" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          VERSION="${REF#v}"   # 去掉前缀 v，CHANGELOG 标题里没有 v
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG sections (en + zh)
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_release_notes.py "${{ steps.ver.outputs.version }}"

      - name: Upload release-notes artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. 创建 GitHub Release：仅附 release-notes.md 作为 body，不上传二进制
  #    - disable 自动生成 release notes（避免与 CHANGELOG 重复）
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: extract-notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release-notes artifact
        uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: notes/release-notes.md
          fail_on_unmatched_files: false
