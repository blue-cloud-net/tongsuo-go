# Fixed Tongsuo releases; release.yml reuses the same checks via workflow_call.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TONGSUO_REPO: Tongsuo-Project/Tongsuo

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.arch }} / Tongsuo ${{ matrix.tongsuo }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tongsuo: [8.4.0, 8.5.0]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
        include:
          - {os: ubuntu-latest, arch: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: macos-15-intel, arch: amd64}
          - {os: macos-latest, arch: arm64}
    env:
      GOARCH: ${{ matrix.arch }}
      TONGSUO_REF: ${{ matrix.tongsuo }}
      TONGSUO_EXPECT_VERSION: ${{ matrix.tongsuo }}
      TONGSUO_HOME: ${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}
      CGO_CFLAGS: -I${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}/include -Wno-deprecated-declarations
      CGO_LDFLAGS: -L${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}/lib
      LD_LIBRARY_PATH: ${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}/lib
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}/lib
      OPENSSL_CONF: ${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}/ssl/openssl.cnf
      TONGSUO_OPENSSL_BIN: ${{ github.workspace }}/.tongsuo-install-${{ matrix.tongsuo }}/bin/openssl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: go.mod
      - name: Cache Tongsuo
        id: cache-tongsuo
        uses: actions/cache@v5
        with:
          path: .tongsuo-install-${{ matrix.tongsuo }}
          key: tongsuo-v5-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.tongsuo }}-shared-${{ hashFiles('scripts/build-tongsuo-ci.sh') }}
      - name: Build Tongsuo
        if: steps.cache-tongsuo.outputs.cache-hit != 'true'
        run: bash scripts/build-tongsuo-ci.sh
      - name: Check CLI identity
        shell: bash
        run: |
          banner=$("$TONGSUO_OPENSSL_BIN" version -a)
          echo "$banner"
          case "$banner" in *"Tongsuo $TONGSUO_REF ("*) ;; *) exit 1;; esac
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Linux static link and tests
        if: runner.os == 'Linux'
        run: go test -count=1 -tags static ./...
      - name: Race tests
        if: runner.os == 'Linux' && matrix.arch == 'amd64'
        run: |
          go test -count=1 -race ./...
          go test -count=50 -race -run '^TestNTLSLoopback$' ./tls
      - name: CLI interop
        if: runner.os == 'Linux' && matrix.arch == 'amd64'
        run: go test -count=1 -tags tongsuocli ./...
