# GitHub Actions CI for tongsuo-go
#
# 触发：push 到 main/dev、PR 到 main/dev、手动触发
# 矩阵：Linux + macOS × Go 1.21 / 1.23
# 阶段：lint → test → build(static)
# Tongsuo 来源：源码编译 + actions/cache，避免每次拉取与重复编译

name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 最小权限：仅读仓库内容
permissions:
  contents: read

# 全局环境变量：方便一处调整 Tongsuo 版本与仓库
env:
  TONGSUO_REPO: Tongsuo-Project/Tongsuo
  # 用 branch 或 tag 都可；推荐固定到稳定 tag（如 v8.5.0）以保证可复现
  TONGSUO_REF: master

# 取消冗余运行：同一分支/同一 PR 的旧运行自动取消
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. 静态检查：go vet（仅 ubuntu，避免重复消耗 runner）
  #    说明：本项目历史上同时跑过 golangci-lint，但 cgo 绑定函数名（EVP_xxx /
  #    HMAC_CTX_new 等）与项目内惯用的 `defer x.Close()` 模式与 lint 默认规则
  #    大量冲突；这些是惯例写法，不属于真实 Bug。lint 暂退为只跑官方 go vet。
  #    如未来要重新启用 lint，先建立 .golangci.yml 并收敛规则范围。
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ubuntu / Go 1.23)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.tongsuo-install/lib
      CGO_CFLAGS: -I${{ github.workspace }}/.tongsuo-install/include -Wno-deprecated-declarations
      CGO_LDFLAGS: -L${{ github.workspace }}/.tongsuo-install/lib
      TONGSUO_HOME: ${{ github.workspace }}/.tongsuo-install
      TONGSUO_CONFIG_FLAGS: --prefix=${{ github.workspace }}/.tongsuo-install --libdir=${{ github.workspace }}/.tongsuo-install/lib enable-ntls enable-trace no-shared
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: go.mod

      # 缓存 Tongsuo 编译/安装产物；go vet 解析 cgo 同样需要 Tongsuo 头文件
      - name: Cache Tongsuo
        id: cache-tongsuo
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.tongsuo-install
          key: tongsuo-${{ runner.os }}-${{ env.TONGSUO_REF }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            tongsuo-${{ runner.os }}-${{ env.TONGSUO_REF }}-

      - name: Build Tongsuo from source
        if: steps.cache-tongsuo.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Cloning Tongsuo (${{ env.TONGSUO_REPO }} @ ${{ env.TONGSUO_REF }})"
          git clone --depth 1 --branch "${{ env.TONGSUO_REF }}" \
            "https://github.com/${{ env.TONGSUO_REPO }}.git" tongsuo
          cd tongsuo
          echo "==> ./config $TONGSUO_CONFIG_FLAGS"
          ./config $TONGSUO_CONFIG_FLAGS
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          echo "==> make -j${JOBS}"
          make -j"${JOBS}"
          echo "==> make install_sw"
          make install_sw
          echo "==> Tongsuo installed to ${{ github.workspace }}/.tongsuo-install"

      - name: go vet
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # 2. 编译与测试：动态链接 + 静态链接
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.21", "1.23"]
    env:
      # macOS 用 DYLD_LIBRARY_PATH；Linux 用 LD_LIBRARY_PATH（脚本会按 OS 区分）
      LD_LIBRARY_PATH: ${{ github.workspace }}/.tongsuo-install/lib
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/.tongsuo-install/lib
      CGO_CFLAGS: -I${{ github.workspace }}/.tongsuo-install/include -Wno-deprecated-declarations
      CGO_LDFLAGS: -L${{ github.workspace }}/.tongsuo-install/lib
      TONGSUO_HOME: ${{ github.workspace }}/.tongsuo-install
      # Tongsuo 编译参数（来源：docs/architecture.md §6.2）
      TONGSUO_CONFIG_FLAGS: --prefix=${{ github.workspace }}/.tongsuo-install --libdir=${{ github.workspace }}/.tongsuo-install/lib enable-ntls enable-trace no-shared
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      # 缓存 Tongsuo 编译/安装产物，按 OS + 版本号区分 key
      - name: Cache Tongsuo
        id: cache-tongsuo
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.tongsuo-install
          key: tongsuo-${{ runner.os }}-${{ env.TONGSUO_REF }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            tongsuo-${{ runner.os }}-${{ env.TONGSUO_REF }}-

      - name: Build Tongsuo from source
        if: steps.cache-tongsuo.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Cloning Tongsuo (${{ env.TONGSUO_REPO }} @ ${{ env.TONGSUO_REF }})"
          git clone --depth 1 --branch "${{ env.TONGSUO_REF }}" \
            "https://github.com/${{ env.TONGSUO_REPO }}.git" tongsuo
          cd tongsuo
          echo "==> ./config $TONGSUO_CONFIG_FLAGS"
          ./config $TONGSUO_CONFIG_FLAGS
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          echo "==> make -j${JOBS}"
          make -j"${JOBS}"
          echo "==> make install_sw"
          make install_sw
          echo "==> Tongsuo installed to ${{ github.workspace }}/.tongsuo-install"

      # Linux：写入 ld.so.conf 并 ldconfig
      # GitHub Actions hosted runner 默认以 `runner` 用户运行（非 root），
      # 写入 /etc 需要 sudo；runner 用户已具备免密 sudo 权限。
      - name: Configure dynamic linker (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "${{ github.workspace }}/.tongsuo-install/lib" \
            | sudo tee /etc/ld.so.conf.d/tongsuo.conf > /dev/null
          sudo ldconfig

      # 动态链接构建
      - name: go build
        run: go build ./...

      # 静态链接构建（验证 internal/native/build_static.go 路径）
      - name: go build (static tag)
        run: go build -tags static ./...

      # 单元测试（默认不含 CLI 对比测试；tongsuocli tag 需要 openssl CLI，
      # 本仓库的 *_tongsuocli_test.go 默认不编译，详见 testing-guide.md §2）
      - name: go test
        run: go test -count=1 ./...
  